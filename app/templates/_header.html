<header class="atlas-container app-header">
    <a href="{{ url_for('web.home') }}" class="atlas-brand" aria-label="Ir al inicio de ATLAS">
        <span class="atlas-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
                <path d="M5.5 10V6.8c0-.7.6-1.3 1.3-1.3H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M22 5.5h3.2c.7 0 1.3.6 1.3 1.3V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M26.5 22v3.2c0 .7-.6 1.3-1.3 1.3H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10 26.5H6.8c-.7 0-1.3-.6-1.3-1.3V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="16" cy="16" r="8.8" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="16" cy="16" r="3.1" stroke="currentColor" stroke-width="1.7"/>
                <path d="M16 7.2h5.1l-3.2 5.5h-6.3L16 7.2Z" fill="currentColor"/>
                <path d="M24.1 12.1 26.6 16l-4.8 3.1-3.2-5.5 5.5-1.5Z" fill="currentColor"/>
                <path d="M21.8 24.1 16 26.8l-2.7-4.8 3.2-5.5 5.3 7.6Z" fill="currentColor"/>
                <path d="M7.9 19.9 5.4 16l4.8-3.1 3.2 5.5-5.5 1.5Z" fill="currentColor"/>
            </svg>
        </span>
        <span class="atlas-brand-copy">
            <span class="atlas-brand-title">ATLAS</span>
            <span class="atlas-brand-subtitle">Plataforma editorial</span>
        </span>
    </a>
    <nav class="atlas-global-nav" aria-label="Navegación global de ATLAS">
        {% for item in atlas_navigation %}
            {% set is_active = request.blueprint == item.blueprint %}
            {% if item.enabled and item.endpoint %}
            <a
                href="{{ url_for(item.endpoint) }}"
                class="atlas-nav-link{% if is_active %} is-active{% endif %}"
                {% if is_active %}aria-current="page"{% endif %}
            >{{ item.label }}</a>
            {% else %}
            <span class="atlas-nav-link is-disabled" aria-disabled="true">{{ item.label }}</span>
            {% endif %}
        {% endfor %}
    </nav>
</header>
